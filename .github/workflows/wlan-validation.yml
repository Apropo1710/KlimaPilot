name: KlimaPilot WLAN Branch Validation

on:
  # The consolidated test branch is validated on every code/configuration push.
  # PROJECT_STATUS-only commits are excluded to avoid unnecessary duplicate builds.
  push:
    branches:
      - test
    paths-ignore:
      - PROJECT_STATUS.md
      - 'app/src/debug/**'
  workflow_dispatch:

permissions:
  # write is needed only to publish the test APK to the separate
  # pre-release tag "klimapilot-test-latest" (never the production tag "latest").
  contents: write

# Test-only debug signing. Only the keystore itself is secret
# (KLIMAPILOT_TEST_KEYSTORE_BASE64); the password is useless without it.
env:
  KLIMAPILOT_TEST_KEY_ALIAS: klimapilot-test
  KLIMAPILOT_TEST_STORE_PASSWORD: ctFyRrvQZrieAoPS2g6hMVaePLMYPsgW

concurrency:
  group: klimapilot-wlan-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Status-Wächter: Wer App-Code oder das ioBroker-Skript ändert, muss im selben Push
      # PROJECT_STATUS.md mitpflegen (Regel aus AGENTS.md). Prüft nur, ob die Datei geändert
      # wurde, nicht den Inhalt.
      - name: Status-Wächter (PROJECT_STATUS.md mitgepflegt?)
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base HEAD origin/main)
          else
            BASE=$(git merge-base "$BEFORE" HEAD)
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          CODE=$(echo "$CHANGED" | grep -E '^(app/src/main/|app/build\.gradle\.kts$|scripts/iobroker/)' || true)
          if [ -n "$CODE" ] && ! echo "$CHANGED" | grep -qx 'PROJECT_STATUS.md'; then
            echo "::error::App-Code oder ioBroker-Skript geändert, aber PROJECT_STATUS.md nicht. Bitte den Status im selben Push aktualisieren (siehe AGENTS.md)."
            echo "Geänderte Dateien:"; echo "$CODE"
            exit 1
          fi
          echo "In Ordnung: $(echo "$CODE" | grep -c . || true) Code-Datei(en) geändert, PROJECT_STATUS.md mitgepflegt bzw. keine Code-Änderung."

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test-Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KLIMAPILOT_TEST_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ env.KLIMAPILOT_TEST_STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KLIMAPILOT_TEST_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret KLIMAPILOT_TEST_KEYSTORE_BASE64 fehlt"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/klimapilot-test-debug.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/klimapilot-test-debug.p12" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Version aus app/build.gradle.kts lesen
        id: version
        run: |
          CODE=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          NAME=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$CODE" && test -n "$NAME"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Erwartet: $NAME / $CODE"

      - name: Unit-Tests und Debug-Kompilierung
        env:
          KLIMAPILOT_TEST_KEYSTORE_PATH: ${{ runner.temp }}/klimapilot-test-debug.p12
          KLIMAPILOT_TEST_KEY_PASSWORD: ${{ env.KLIMAPILOT_TEST_STORE_PASSWORD }}
        run: gradle --no-daemon -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=1000 testDebugUnitTest assembleDebug compileReleaseKotlin lintVitalRelease

      - name: Debug-APK für Smartphone-Praxistest prüfen
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          APP_ID=$( "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" )
          VERSION_CODE=$( "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK" )
          VERSION_NAME=$( "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK" )
          test "$APP_ID" = "de.klimapilot.app.debug"
          test "$VERSION_CODE" = "${{ steps.version.outputs.code }}"
          test "$VERSION_NAME" = "${{ steps.version.outputs.name }}-debug"
          PERMISSIONS=$( "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK" )
          if printf '%s\\n' "$PERMISSIONS" | grep -q "android.permission.REQUEST_INSTALL_PACKAGES"; then
            echo "ERROR: Debug APK still declares REQUEST_INSTALL_PACKAGES"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          # Fixed test signature (public certificate fingerprint, not a secret).
          EXPECTED_CERT_SHA256="230865b90b0c37e6a7935fd4f5e0fad0626853a44921a7a2f7d6185b9665ecfb"
          CERTS=$( "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" )
          printf '%s\n' "$CERTS"
          SIGNER_COUNT=$( printf '%s\n' "$CERTS" | grep -c '^Signer #[0-9]* certificate SHA-256 digest:' )
          ACTUAL_CERT_SHA256=$( printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' )
          test "$SIGNER_COUNT" = "1" || { echo "ERROR: expected exactly one signer, got $SIGNER_COUNT"; exit 1; }
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: debug APK signed with unexpected certificate $ACTUAL_CERT_SHA256"
            exit 1
          fi
          echo "Test-Signatur bestätigt: $ACTUAL_CERT_SHA256"
          sha256sum "$APK" | tee debug-apk.sha256
          printf 'cert-sha256  %s\n' "$ACTUAL_CERT_SHA256" >> debug-apk.sha256

      - name: Debug-APK als Testartefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: KlimaPilot-debug-test-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            debug-apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Test-APK als Direktdownload veröffentlichen (Pre-Release, nicht "latest")
        if: github.ref == 'refs/heads/test'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: klimapilot-test-latest
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KlimaPilot-test.apk
          cat > release-notes.md <<NOTES
          KlimaPilot Testversion ${{ steps.version.outputs.name }}-debug (versionCode ${{ steps.version.outputs.code }})
          KlimaPilot-Version: ${{ steps.version.outputs.name }}

          - Paketkennung: de.klimapilot.app.debug
          - Quellcommit: ${GITHUB_SHA}
          - Workflow: #${GITHUB_RUN_NUMBER} (Run-ID ${GITHUB_RUN_ID})
          - Prüfsummen:

          \`\`\`
          $(cat debug-apk.sha256)
          \`\`\`

          Nur für Tests. Das produktive Release "latest" und der Updater sind davon nicht betroffen.
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false \
              --title "KlimaPilot Test – neueste APK" --notes-file release-notes.md
          else
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "KlimaPilot Test – neueste APK" --notes-file release-notes.md
          fi
          gh release upload "$TAG" KlimaPilot-test.apk debug-apk.sha256 --clobber
