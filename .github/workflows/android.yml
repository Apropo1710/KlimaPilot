name: KlimaPilot Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

concurrency:
  group: klimapilot-release-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Release-Keystore bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KLIMAPILOT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Keystore-Secret fehlt"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/klimapilot-release.jks"
          chmod 600 "$RUNNER_TEMP/klimapilot-release.jks"

      - name: Keystore-Format prüfen
        env:
          STORE_PASSWORD: ${{ secrets.KLIMAPILOT_STORE_PASSWORD }}
        run: keytool -list -keystore "$RUNNER_TEMP/klimapilot-release.jks" -storepass "$STORE_PASSWORD"

      - name: Release-APK bauen
        env:
          KLIMAPILOT_KEYSTORE_PATH: ${{ runner.temp }}/klimapilot-release.jks
          KLIMAPILOT_STORE_PASSWORD: ${{ secrets.KLIMAPILOT_STORE_PASSWORD }}
          KLIMAPILOT_KEY_ALIAS: ${{ secrets.KLIMAPILOT_KEY_ALIAS }}
          KLIMAPILOT_KEY_PASSWORD: ${{ secrets.KLIMAPILOT_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: APK für Nutzer benennen
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/KlimaPilot.apk

      - name: APK und Signatur prüfen
        run: |
          APK="app/build/outputs/apk/release/KlimaPilot.apk"
          test -f "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: APK als Build-Artefakt hochladen
        if: github.event_name == 'workflow_dispatch'
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlimaPilot-release-apk
          path: app/build/outputs/apk/release/KlimaPilot.apk
          if-no-files-found: error
          retention-days: 1

      - name: Projektstatus mit verifizierten Build-Daten aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d '"' -f2)
          VERSION_CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+')
          APK="app/build/outputs/apk/release/KlimaPilot.apk"
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ARTIFACT_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts")
            ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r '.artifacts[] | select(.name=="KlimaPilot-release-apk") | .id' | head -n 1)
            ARTIFACT_SIZE=$(echo "$ARTIFACT_JSON" | jq -r '.artifacts[] | select(.name=="KlimaPilot-release-apk") | .size_in_bytes' | head -n 1)
            test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
            ARTIFACT_STATUS="KlimaPilot-release-apk, ID $ARTIFACT_ID, $ARTIFACT_SIZE Bytes (manueller Build)"
          else
            ARTIFACT_STATUS="kein Actions-Artefakt; APK wird im GitHub-Release latest veröffentlicht"
          fi
          export VERSION_NAME VERSION_CODE APK_SHA ARTIFACT_STATUS
          git fetch origin main
          git reset --mixed origin/main
          git checkout origin/main -- PROJECT_STATUS.md
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("PROJECT_STATUS.md")
          old = p.read_text()
          start = "<!-- AUTO-PRODUCTION-STATUS:START -->"
          end = "<!-- AUTO-PRODUCTION-STATUS:END -->"
          block = f"""<!-- AUTO-PRODUCTION-STATUS:START -->
          ## Automatisch gepflegter Produktionsstatus

          - Quellcommit des APK-Builds: {os.environ['GITHUB_SHA']}
          - App-Version / versionCode: **{os.environ['VERSION_NAME']} / {os.environ['VERSION_CODE']}**
          - Build-Zeit: {os.popen("date -u +'%Y-%m-%d %H:%M:%S UTC'").read().strip()}
          - APK-Dateiname: **KlimaPilot.apk**
          - APK-Signaturprüfung: erfolgreich (apksigner verify --print-certs)
          - Build-Artefakt: {os.environ['ARTIFACT_STATUS']}
          - APK-SHA-256: {os.environ['APK_SHA']}
          - GitHub-Release: Veröffentlichung wird in diesem Workflow nach dem Statuscommit abgeschlossen.
          - Smartphone-Test: **nicht durch CI geprüft**; nur separat bestätigte Nutzerberichte gelten als Gerätetest.
          - Updater: abgeschlossen und vom Nutzer bestätigt; Installer-Code wird durch diese Dokumentationspflege nicht verändert.\n          - ChatGPT-Bibliotheksakte: separate Langzeit-/Historienakte; wird durch diesen Workflow nicht verändert.

          <!-- AUTO-PRODUCTION-STATUS:END -->"""
          if start in old and end in old:
              a = old.index(start)
              b = old.index(end, a) + len(end)
              old = old[:a] + block + old[b:]
          else:
              old = block + "\n\n" + old
          import re
          for heading in ("Aktueller Produktionsstand", "Build und Veröffentlichung"):
              pattern = rf"(?ms)^## {re.escape(heading)}\n.*?(?=^## |\\Z)"
              note = (
                  f"## {heading}\n\n"
                  "Die verbindlichen aktuellen Build-, Signatur-, Artefakt- und Release-Daten "
                  "stehen im automatisch gepflegten Produktionsstatus am Dokumentanfang. "
                  "Ältere Einzelstände werden nicht als aktueller Produktionsstand fortgeführt.\n\n"
              )
              old, _ = re.subn(pattern, note, old, count=1)
          p.write_text(old.rstrip() + "\\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh generated production status [skip ci]"
            git push origin HEAD:main
          fi

      - name: Git-Tag latest auf dokumentierten Produktionsstand setzen
        run: |
          git fetch origin main
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Neueste APK im privaten Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          gh release view latest >/dev/null
          gh release edit latest --title "KlimaPilot – neueste APK" --notes "KlimaPilot-Version: $VERSION_NAME
          Automatisch gebaut und signiert. Quellstand: $GITHUB_SHA."
          gh release upload latest app/build/outputs/apk/release/KlimaPilot.apk --clobber

      - name: Veröffentlichung im Produktionsstatus bestätigen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git reset --mixed origin/main
          git checkout origin/main -- PROJECT_STATUS.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path("PROJECT_STATUS.md")
          text = p.read_text()
          text = text.replace(
              "- GitHub-Release: Veröffentlichung wird in diesem Workflow nach dem Statuscommit abgeschlossen.",
              "- GitHub-Release: **erfolgreich veröffentlicht**; Asset KlimaPilot.apk wurde aktualisiert."
          )
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: confirm production release status [skip ci]"
            git push origin HEAD:main
          fi
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          gh release edit latest --notes "KlimaPilot-Version: $VERSION_NAME
          Automatisch gebaut, signiert und veröffentlicht. Produktionsstatus und Quellstand siehe PROJECT_STATUS.md. Quellstand: $GITHUB_SHA."
