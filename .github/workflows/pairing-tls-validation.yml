name: KlimaPilot Local TCP Peer Authentication

# Dieser Emulator-/Instrumentierungsworkflow wird nicht automatisch ausgeführt.
# Er bleibt als manuell auslösbarer Diagnoseworkflow dokumentiert; reguläre
# Entwicklung auf test nutzt ausschließlich wlan-validation.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klimapilot-pairing-tcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  peer-authentication-api26:
    name: Android Keystore TCP Peer Auth (API 26 – manuell)
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5
      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-26" "build-tools;35.0.0"
      - name: Runner- und KVM-Diagnose
        run: |
          echo "=== CPU ==="
          nproc
          grep -m1 "model name" /proc/cpuinfo || true
          echo "=== KVM ==="
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "/dev/kvm fehlt"; fi
          id
          grep '^kvm:' /etc/group || true
      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android Emulator und TCP-Peer-Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: set +e; gradle --no-daemon testDebugUnitTest connectedDebugAndroidTest; result=$?; adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/tcp-api26-logcat.txt"; adb shell dumpsys activity > "$GITHUB_WORKSPACE/tcp-api26-activity.txt" 2>&1; adb shell dumpsys cpuinfo > "$GITHUB_WORKSPACE/tcp-api26-cpuinfo.txt" 2>&1; adb shell dumpsys package de.klimapilot.app.debug > "$GITHUB_WORKSPACE/tcp-api26-package.txt" 2>&1; adb root >/dev/null 2>&1 || true; adb shell ls -la /data/anr > "$GITHUB_WORKSPACE/tcp-api26-anr-list.txt" 2>&1; adb pull /data/anr "$GITHUB_WORKSPACE/tcp-api26-anr" >/dev/null 2>&1 || true; exit $result
      - name: Debug-APK für Smartphone-Praxistest prüfen
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          APP_ID=$( "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" )
          VERSION_CODE=$( "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK" )
          VERSION_NAME=$( "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK" )
          test "$APP_ID" = "de.klimapilot.app.debug"
          test "$VERSION_CODE" = "98"
          test "$VERSION_NAME" = "0.4.68-debug"
          PERMISSIONS=$( "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK" )
          if printf '%s\\n' "$PERMISSIONS" | grep -q "android.permission.REQUEST_INSTALL_PACKAGES"; then
            echo "ERROR: Debug APK still declares REQUEST_INSTALL_PACKAGES"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee tcp-api26-debug-apk.sha256
      - name: Debug-APK als Testartefakt bereitstellen
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: KlimaPilot-debug-api26-test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            tcp-api26-debug-apk.sha256
          if-no-files-found: error
          retention-days: 7
      - name: API-26-Diagnose sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tcp-api26-diagnostics
          path: |
            tcp-api26-*.txt
            tcp-api26-anr/
          if-no-files-found: warn
          retention-days: 7
