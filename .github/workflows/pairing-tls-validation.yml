name: KlimaPilot Local TCP Peer Authentication

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klimapilot-pairing-tcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  peer-authentication:
    if: matrix.api-level == 26 || github.event_name == 'workflow_dispatch'
    name: Android Keystore TCP Peer Auth (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # API 26 is mandatory for every PR. API 35 is manual-only until the
        # GitHub-hosted Linux runner provides usable KVM acceleration.
        api-level: [26, 35]
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
      - name: Android SDK Pakete installieren
        run: |
          sdkmanager "platform-tools" "platforms;android-${{ matrix.api-level }}" "build-tools;35.0.0"
      - name: Runner- und KVM-Diagnose
        run: |
          echo "=== CPU ==="
          nproc
          grep -m1 "model name" /proc/cpuinfo || true
          echo "=== KVM ==="
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "/dev/kvm fehlt"; fi
          id
          grep '^kvm:' /etc/group || true
      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android Emulator und TCP-Peer-Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set +e
            gradle --no-daemon connectedDebugAndroidTest
            result=$?
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/tcp-api${{ matrix.api-level }}-logcat.txt"
            adb shell dumpsys activity > "$GITHUB_WORKSPACE/tcp-api${{ matrix.api-level }}-activity.txt" 2>&1
            adb shell dumpsys cpuinfo > "$GITHUB_WORKSPACE/tcp-api${{ matrix.api-level }}-cpuinfo.txt" 2>&1
            adb shell ls -la /data/anr > "$GITHUB_WORKSPACE/tcp-api${{ matrix.api-level }}-anr-list.txt" 2>&1
            adb pull /data/anr "$GITHUB_WORKSPACE/tcp-api${{ matrix.api-level }}-anr" >/dev/null 2>&1 || true
            adb shell dumpsys package de.klimapilot.app.debug > "$GITHUB_WORKSPACE/tcp-api${{ matrix.api-level }}-package.txt" 2>&1
            exit $result
      - name: API-Diagnose sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-api${{ matrix.api-level }}-diagnostics
          path: |
            tcp-api${{ matrix.api-level }}-*.txt
            tcp-api${{ matrix.api-level }}-anr/
          if-no-files-found: warn
          retention-days: 7
