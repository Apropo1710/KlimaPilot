name: KlimaPilot Local TCP Peer Authentication

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klimapilot-pairing-tcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  peer-authentication-api26:
    name: Android Keystore TCP Peer Auth (API 26 – Pflicht)
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-26" "build-tools;35.0.0"
      - name: Runner- und KVM-Diagnose
        run: |
          echo "=== CPU ==="
          nproc
          grep -m1 "model name" /proc/cpuinfo || true
          echo "=== KVM ==="
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "/dev/kvm fehlt"; fi
          id
          grep '^kvm:' /etc/group || true
      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android Emulator und TCP-Peer-Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: set +e; gradle --no-daemon testDebugUnitTest connectedDebugAndroidTest; result=$?; adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/tcp-api26-logcat.txt"; adb shell dumpsys activity > "$GITHUB_WORKSPACE/tcp-api26-activity.txt" 2>&1; adb shell dumpsys cpuinfo > "$GITHUB_WORKSPACE/tcp-api26-cpuinfo.txt" 2>&1; adb shell dumpsys package de.klimapilot.app.debug > "$GITHUB_WORKSPACE/tcp-api26-package.txt" 2>&1; adb root >/dev/null 2>&1 || true; adb shell ls -la /data/anr > "$GITHUB_WORKSPACE/tcp-api26-anr-list.txt" 2>&1; adb pull /data/anr "$GITHUB_WORKSPACE/tcp-api26-anr" >/dev/null 2>&1 || true; exit $result
      - name: API-26-Diagnose sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-api26-diagnostics
          path: |
            tcp-api26-*.txt
            tcp-api26-anr/
          if-no-files-found: warn
          retention-days: 7

  peer-authentication-api35:
    if: github.event_name == 'workflow_dispatch'
    name: Android Keystore TCP Peer Auth (API 35 – manuell)
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Runner- und KVM-Diagnose
        run: |
          echo "=== CPU ==="
          nproc
          grep -m1 "model name" /proc/cpuinfo || true
          echo "=== KVM ==="
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "/dev/kvm fehlt"; fi
          id
          grep '^kvm:' /etc/group || true
      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android Emulator und TCP-Peer-Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: set +e; gradle --no-daemon connectedDebugAndroidTest; result=$?; adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/tcp-api35-logcat.txt"; adb shell dumpsys activity > "$GITHUB_WORKSPACE/tcp-api35-activity.txt" 2>&1; adb shell dumpsys cpuinfo > "$GITHUB_WORKSPACE/tcp-api35-cpuinfo.txt" 2>&1; adb shell dumpsys package de.klimapilot.app.debug > "$GITHUB_WORKSPACE/tcp-api35-package.txt" 2>&1; adb root >/dev/null 2>&1 || true; adb shell ls -la /data/anr > "$GITHUB_WORKSPACE/tcp-api35-anr-list.txt" 2>&1; adb pull /data/anr "$GITHUB_WORKSPACE/tcp-api35-anr" >/dev/null 2>&1 || true; exit $result
      - name: API-35-Diagnose sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-api35-diagnostics
          path: |
            tcp-api35-*.txt
            tcp-api35-anr/
          if-no-files-found: warn
          retention-days: 7
