name: KlimaPilot Local TCP Peer Authentication

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klimapilot-pairing-tcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  peer-authentication:
    name: Android Keystore TCP Peer Auth (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # API 26 passed both TCP tests. Isolate API 35 to capture its
        # instrumentation crash without spending another emulator run on API 26.
        api-level: [35]
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android Emulator und TCP-Peer-Test
        id: android-tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: >-
            gradle --no-daemon connectedDebugAndroidTest;
            result=$?;
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/tcp-api35-logcat.txt";
            adb shell dumpsys activity > "$GITHUB_WORKSPACE/tcp-api35-activity.txt" 2>&1;
            adb shell dumpsys package de.klimapilot.app.debug > "$GITHUB_WORKSPACE/tcp-api35-package.txt" 2>&1;
            exit $result
      - name: API-35-Diagnose sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-api35-diagnostics
          path: |
            tcp-api35-logcat.txt
            tcp-api35-activity.txt
            tcp-api35-package.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Testergebnis übernehmen
        if: steps.android-tests.outcome == 'failure'
        run: exit 1
