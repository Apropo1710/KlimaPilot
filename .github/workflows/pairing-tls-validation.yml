name: KlimaPilot Pairing TLS Compatibility

on:
  push:
    branches:
      - feature/local-wifi-pairing
  pull_request:
    branches:
      - feature/local-wifi-profile-sync
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klimapilot-pairing-tls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  keystore-mutual-tls:
    name: Android Keystore mTLS (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android Emulator und Keystore-TLS-Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb logcat -c
            set +e
            gradle --no-daemon connectedDebugAndroidTest
            test_status=$?
            mkdir -p build-logs
            adb logcat -d -v threadtime > "build-logs/logcat-api-${{ matrix.api-level }}.txt"
            cat "build-logs/logcat-api-${{ matrix.api-level }}.txt"
            exit "$test_status"

      - name: Emulator-Logcat als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pairing-tls-logcat-api-${{ matrix.api-level }}
          path: build-logs/logcat-api-${{ matrix.api-level }}.txt
          if-no-files-found: ignore
